# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.  
# Replace the variables relative to your project in the "env" section below.
# 
# 2. Signing
# Generate a signing certificate in the Windows Application 
# Packaging Project or add an existing signing certificate to the project.
# Next, use PowerShell to encode the .pfx file using Base64 encoding
# by running the following Powershell script to generate the output string:
# 
# $pfx_cert = Get-Content '.\SigningCertificate.pfx' -Encoding Byte
# [System.Convert]::ToBase64String($pfx_cert) | Out-File 'SigningCertificate_Encoded.txt'
#
# Open the output file, SigningCertificate_Encoded.txt, and copy the
# string inside. Then, add the string to the repo as a GitHub secret
# and name it "Base64_Encoded_Pfx."
# For more information on how to configure your signing certificate for 
# this workflow, refer to https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# Finally, add the signing certificate password to the repo as a secret and name it "Pfx_Key".
# See "Build the Windows Application Packaging project" below to see how the secret is used.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: Main Workflow

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "0 18 * * 0"
    
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug,Release]

    # runs-on: windows-2025-vs2026 # this was tested on 5/12/26
    runs-on: windows-latest  # For a list of available runner types, refer to 
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
                             
    env:    
      Solution_Name: GSSolution.sln           # Replace with your solution name, i.e. MyWpfApp.sln.
      #ACTIONS_ALLOW_UNSECURE_COMMANDS: true  # https://github.blog/changelog/2020-10-01-github-actions-deprecating-set-env-and-add-path-commands/
          
    steps:
    
      - name: Check Code
        shell: powershell
        run: |
          dotnet nuget locals all --clear
          
      - name: Checkout
        uses: actions/checkout@v5 #v3 to v4
        with:
          fetch-depth: 0
          
      # fix for error NU1101: Unable to find package    
      # - name: Clean
      #  run: dotnet clean $env:Solution_Name -c Debug && dotnet nuget locals all --clear


    # Install the .NET Core workload
      - name: Install .NET Core
        uses: actions/setup-dotnet@v5 #v3 to v4
        with:
          dotnet-version: 3.1.x

    # Add MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3 #2008f912f56e61277eefaac6d1888b750582aa16 v1.1 to v2
        
    # Restore the application to populate the obj folder with RuntimeIdentifiers
    # RestorePackagesConfig also restores the packages.config based test project
      - name: Restore the application
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration /p:RestorePackagesConfig=true
        env:
           Configuration: ${{ matrix.configuration }}

    # Compile every project so a change that does not build fails the workflow
      - name: Build the solution
        run: msbuild $env:Solution_Name /t:Build /m /p:Configuration=$env:Configuration
        env:
           Configuration: ${{ matrix.configuration }}

    # Run the MSTest unit tests with the Visual Studio test runner already installed on the image.
    # The tests write C:\temp\points.GssPointModel and a shared Points.config, so C:\temp must exist and they
    # run one at a time.
      - name: Run unit tests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path C:\temp -Force | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "**\TestPlatform\vstest.console.exe" | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found" }
          $tests = Get-ChildItem -Recurse -Filter AlignmentModelTests.dll | Where-Object { $_.FullName -match "\\bin\\$env:Configuration\\" -and $_.FullName -notmatch "\\obj\\" } | Select-Object -First 1
          if (-not $tests) { throw "AlignmentModelTests.dll not found for $env:Configuration" }
          $rs = Join-Path $env:RUNNER_TEMP "serial.runsettings"
          '<?xml version="1.0" encoding="utf-8"?><RunSettings><RunConfiguration><DisableParallelization>true</DisableParallelization></RunConfiguration><MSTest><Parallelize><Workers>1</Workers><Scope>ClassLevel</Scope></Parallelize></MSTest></RunSettings>' | Set-Content $rs
          & $vstest $tests.FullName /Settings:$rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
           Configuration: ${{ matrix.configuration }}

